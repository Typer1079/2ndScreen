<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2ndScreen</title>
  <link rel="stylesheet" href="2ndScreen.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="icon-192x192.png" type="image/png" sizes="192x192">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  <meta name="theme-color" content="#ffffff">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 20px; /* Add padding for some space on the sides */
      box-sizing: border-box; /* Ensure padding is included in element's total width and height */
      height: 60px; /* Set the height of the header row */
    }
    .left, .right {
      display: flex;
      align-items: center;
      width: 30%;
    }
    .left {
      justify-content: flex-start;
      padding-left: 25px; /* Reduced left padding for the camera dropdown */
    }
    .right {
      justify-content: flex-end;
      padding-right: 25px; /* Reduced right padding for the resolution dropdown */
    }
    .title {
      text-align: center;
      flex-grow: 1;
    }
    select {
      min-width: 150px; /* Set a minimum width for select elements */
    }
    .video-container {
      width: calc(100% - 5px); /* Reduced horizontal padding */
      height: calc(100vh - 90px); /* Full height minus header height and additional padding */
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 5px; /* Reduced horizontal padding */
      padding: 5px; /* Reduced vertical padding */
      box-sizing: border-box; /* Ensure padding is included in element's total width and height */
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Ensure the entire video fits within the container */
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="left">
      <!-- Camera input dropdown -->
      <label for="inputSelect">Camera:</label>
      <select id="inputSelect">
        <!-- Options will be populated dynamically -->
      </select>
    </div>
    <div class="title">
      <h1>2ndScreen</h1>
    </div>
    <div class="right">
      <!-- Camera resolution dropdown -->
      <label for="resolutionSelect">Resolution:</label>
      <select id="resolutionSelect">
        <option value="2560x1440">2560x1440</option>
        <option value="1920x1080">1920x1080</option>
        <option value="1680x1050">1680x1050</option>  
        <option value="1280x720">1280x720</option>
      </select>
    </div>
  </div>

  <!-- Video container to display the stream -->
  <div class="video-container">
    <video id="videoElement" autoplay></video>
  </div>

  <script>
    function enterFullscreen() {
      var videoElement = document.getElementById('videoElement');
      if (videoElement.requestFullscreen) {
        videoElement.requestFullscreen();
      } else if (videoElement.mozRequestFullScreen) { // Firefox
        videoElement.mozRequestFullScreen();
      } else if (videoElement.webkitRequestFullscreen) { // Chrome, Safari, and Opera
        videoElement.webkitRequestFullscreen();
      } else if (videoElement.msRequestFullscreen) { // IE/Edge
        videoElement.msRequestFullscreen();
      }
    }

    document.getElementById('resolutionSelect').addEventListener('change', function() {
      var resolution = this.value;
      var videoElement = document.getElementById('videoElement');
      // Example: Change source based on selected resolution
      switch (resolution) {
        case '2560x1440':
          videoElement.src = 'path_to_2560x1440_video.mp4';
          break;
        case '1920x1080':
          videoElement.src = 'path_to_1920x1080_video.mp4';
          break;
        case '1680x1050':
          videoElement.src = 'path_to_1680x1050_video.mp4';
          break;
        case '1280x720':
          videoElement.src = 'path_to_1280x720_video.mp4';
          break;
        case '1024x1366':
          videoElement.src = 'path_to_1024x1366_video.mp4';
          break;
        default:
          videoElement.src = '';
      }
      videoElement.play();
      enterFullscreen();
    });

    // Request camera access and list available cameras
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(function(stream) {
        // Get the video tracks from the stream
        var videoTracks = stream.getVideoTracks();
        
        // Populate the camera dropdown with available cameras
        return navigator.mediaDevices.enumerateDevices();
      })
      .then(function(devices) {
        var inputSelect = document.getElementById('inputSelect');
        inputSelect.innerHTML = ""; // Clear the dropdown
        devices.forEach(function(device) {
          if (device.kind === 'videoinput') {
            var option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Camera ${inputSelect.length + 1}`;
            inputSelect.appendChild(option);
          }
        });
      })
      .catch(function(err) {
        console.error('Error accessing camera: ', err);
      });
  </script>

  <script src="2ndScreen.js"></script>

  <!-- Service Worker -->
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(() => console.log('Service Worker registered!'));
  }
  </script>
</body>
</html>
