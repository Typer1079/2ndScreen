<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2ndScreen</title>
  <link rel="stylesheet" href="2ndScreen.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="icon-192x192.png" type="image/png" sizes="192x192">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  <meta name="theme-color" content="#ffffff">
  <style>
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 20px; /* Add padding for some space on the sides */
    }
    .left, .right {
      display: flex;
      align-items: center;
      width: 30%;
    }
    .left {
      justify-content: flex-start;
      padding-left: 100px; /* Set left padding for the camera dropdown */
    }
    .right {
      justify-content: flex-end;
      padding-right: 100px; /* Set right padding for the resolution dropdown */
    }
    .title {
      text-align: center;
      flex-grow: 1;
    }
    select {
      min-width: 150px; /* Set a minimum width for select elements */
    }
    video {
      width: 100%;
      height: auto;
      max-height: 100vh; /* Ensure the video doesn't exceed the viewport height */
      object-fit: contain; /* Fit within the container without cropping */
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="left">
      <!-- Camera input dropdown -->
      <label for="inputSelect">Camera:</label>
      <select id="inputSelect">
        <option value="front">Front Camera</option>
        <option value="rear">Rear Camera</option>
      </select>
    </div>
    <div class="title">
      <h1>2ndScreen</h1>
    </div>
    <div class="right">
      <!-- Camera resolution dropdown -->
      <label for="resolutionSelect">Resolution:</label>
      <select id="resolutionSelect">
        <option value="2560x1440">2560x1440</option>
        <option value="1920x1080">1920x1080</option>
        <option value="1680x1050">1680x1050</option>  
        <option value="1280x720">1280x720</option>
        <option value="640x480">640x480</option>
